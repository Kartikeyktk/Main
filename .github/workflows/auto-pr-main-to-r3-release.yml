name: Auto PR — Source to Target

on:
  push:
    branches:
      - main

env:
  SOURCE_BRANCH: main   
  TARGET_BRANCH: R3-Develop
  ALLOWED_MERGE_SOURCE: development
  
jobs:
  create-pull-request:
    name: Create Auto PR 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

       # ── 2. Validate Merge Source ─────────────────────────────────────────────
      - name: Validate Merge Source
        id: check_merge_source
        run: |
          MERGE_MSG=$(git log -1 --pretty=format:'%s')
          echo "Last commit message: $MERGE_MSG"

          if echo "$MERGE_MSG" | grep -qE "from .*/${ALLOWED_MERGE_SOURCE}$"; then
            echo "Merge originated from '$ALLOWED_MERGE_SOURCE' — proceeding."
          else
            echo "Merge did NOT originate from '$ALLOWED_MERGE_SOURCE'. Skipping Auto PR."
            exit 1
          fi

      # ── 2. Validate Target Branch Exists ────────────────────────────────────
      - name: Validate Target Branch Exists
        id: check_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if target branch '$TARGET_BRANCH' exists on remote..."
          BRANCH_EXISTS=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")
          if [ -z "$BRANCH_EXISTS" ]; then
            echo "::error::Target branch '$TARGET_BRANCH' does not exist in the repository."
            echo "Please create the branch first: git checkout -b $TARGET_BRANCH && git push origin $TARGET_BRANCH"
            exit 1
          else
            echo "Target branch '$TARGET_BRANCH' found — proceeding."
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          fi

      # ── 3. Check for Existing Open PR ───────────────────────────────────────
      - name: Check for Existing Open PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "::error::An open PR from $SOURCE_BRANCH → $TARGET_BRANCH already exists (PR #$EXISTING_PR). Skipping."
            exit 1
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ── 4. Create Pull Request ───────────────────────────────────────────────
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title "chore: Auto PR — merge $SOURCE_BRANCH into $TARGET_BRANCH ($(date +'%Y-%m-%d %H:%M UTC'))" \
            --body "## Automated Pull Request

          This PR was automatically generated by GitHub Actions after a push to **\`$SOURCE_BRANCH\`**.

          | Field        | Value |
          |--------------|-------|
          | Source       | \`$SOURCE_BRANCH\` |
          | Target       | \`$TARGET_BRANCH\` |
          | Commit SHA   | \`${{ github.sha }}\` |
          | Triggered by | @${{ github.actor }} |
          | Workflow Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          > Please review all changes before merging to keep the **\`$TARGET_BRANCH\`** branch current."

          echo "Pull Request created successfully from $SOURCE_BRANCH → $TARGET_BRANCH."
