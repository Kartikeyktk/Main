name: Auto PR — Source to Target

on:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  SOURCE_BRANCH: main
  TARGET_BRANCH: R3-Develop

jobs:
  create-pull-request:
    name: Create Auto PR
    # Only run if the PR was actually merged AND came from the allowed source branch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'R3-Develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      # ── 2. Validate Target Branch Exists ────────────────────────────────────
      - name: Validate Target Branch Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if target branch '$TARGET_BRANCH' exists on remote..."
          if ! git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" > /dev/null; then
            echo "::error::Target branch '$TARGET_BRANCH' does not exist in the repository."
            echo "Please create the branch first: git checkout -b $TARGET_BRANCH && git push origin $TARGET_BRANCH"
            exit 1
          fi
          echo "Target branch '$TARGET_BRANCH' found — proceeding."

      # ── 3. Check for Existing Open PR ───────────────────────────────────────
      - name: Check for Existing Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "::error::An open PR from $SOURCE_BRANCH → $TARGET_BRANCH already exists (PR #$EXISTING_PR). Skipping."
            exit 1
          fi

      # ── 4. Create Pull Request ───────────────────────────────────────────────
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title "chore: Auto PR — merge $SOURCE_BRANCH into $TARGET_BRANCH ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --body "## Automated Pull Request

          This PR was automatically generated by GitHub Actions after merging PR #${{ github.event.pull_request.number }} (from \`${{ github.event.pull_request.head.ref }}\`) into **\`$SOURCE_BRANCH\`**.

          | Field        | Value |
          |--------------|-------|
          | Source       | \`$SOURCE_BRANCH\` |
          | Target       | \`$TARGET_BRANCH\` |
          | Merged PR    | #${{ github.event.pull_request.number }} |
          | Commit SHA   | \`${{ github.sha }}\` |
          | Triggered by | @${{ github.actor }} |
          | Workflow Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          > Please review all changes before merging to keep the **\`$TARGET_BRANCH\`** branch current."

          echo "Pull Request created successfully from $SOURCE_BRANCH → $TARGET_BRANCH."
